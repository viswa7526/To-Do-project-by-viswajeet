<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do by viswajeet</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div id="side_container">
        <div id="logo_image">
             <div class="logo-container">

        <div class="logo-icon">
            <span class="check"></span>
        </div>

        <div class="logo-text">
            <h1>To-Do</h1>
            <p>  By Viswajeet</p>
        </div>

    </div>
        </div>
        <div id="menu_box">
            <div class="menu">
                <div class="inner_menu">
                    <i class="fa-solid fa-house"></i>
                    Dashboard
                </div>
            </div>
            <div class="menu">
                <div class="inner_menu">
                    <i class="fa-solid fa-list-check"></i>
                    My Tasks
                </div>
            </div>
            <div class="menu">
                <div class="inner_menu">
                    <i class="fa-solid fa-star"></i>
                    Important
                </div>
            </div>
            <div class="menu">
                <div class="inner_menu">
                    <i class="fa-solid fa-circle-check"></i>
                    Completed
                </div>
            </div>
            <div class="menu">
                <div class="inner_menu">
                    <i class="fa-solid fa-folder"></i>
                    Categories
                </div>
            </div>
            <div class="menu">
                <div class="inner_menu">
                    <i class="fa-solid fa-gear"></i>
                    Settings
                </div>
            </div>
        </div>
        <div id="mode">
            <label class="mode_switch" for="dark_mode_switch">
                <i id="mode_icon" class="fa-solid fa-sun" aria-hidden="true"></i>
                <span id="mode_label">Light mode</span>
                <input type="checkbox" id="dark_mode_switch" role="switch" aria-label="Dark mode" checked>
            </label>
        </div>
        <div id="quotes">
        </div>
    </div>


    <script src="script.js"></script>
</body>
</html>
